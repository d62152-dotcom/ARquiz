<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>全問正解おめでとう！｜海洋堂ARクイズラリー</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="clear.css">
    <!-- 見やすい角丸フォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- お祝いの紙吹雪演出 -->
    <div class="confetti-container" aria-hidden="true">
        <div class="confetti"></div><div class="confetti"></div>
        <div class="confetti"></div><div class="confetti"></div>
        <div class="confetti"></div><div class="confetti"></div>
        <div class="confetti"></div><div class="confetti"></div>
    </div>

    <div id="outer">
        <main class="clear-card">
            
            <!-- 1. 祝福ヘッダー -->
            <header class="clear-header">
                <div class="badge">MISSION COMPLETE!</div>
                <h1>ぜんもんせいかい！<br><span class="highlight">おめでとう！！</span></h1>
            </header>

            <!-- 2. スタンプ（スタッフ確認用メインエリア） -->
            <div class="stamp-container">
                <div class="stamp-frame">
                    <img src="images/stamp/全問正解.jpg" alt="全問正解スタンプ" class="stamp-image">
                </div>
            </div>

            <!-- 3. スタッフに見せる指示 -->
            <div class="reception-guide">
                <p class="guide-text">
                    この<ruby>画面<rt>がめん</rt></ruby>を<ruby>受<rt>う</rt></ruby>け<ruby>付<rt>つ</rt></ruby>けの<ruby>人<rt>ひと</rt></ruby>に<ruby>見<rt>み</rt></ruby>せてね！
                </p>
                <p class="sub-text">※景品（オリジナルポストカード）がもらえるよ！</p>
            </div>

            <!-- 4. Googleフォーム（アンケート）リンクボタン -->
            <div class="survey-container">
                <p class="survey-title">📝 クイズラリーの感想をおしえてね！</p>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSczkO3vyU0O9Tlit2I1jtY0QSrg38aOl59SbziwXtgxCSIYGg/viewform?usp=dialog" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="survey-btn">
                   <ruby>アンケート<rt>あんけーと</rt></ruby>にこたえる（1<ruby>分<rt>ふん</rt></ruby>）
                </a>
            </div>

        </main>

        <footer>
            <p>© 海洋堂SpaceFactoryなんこく / 高知高専</p>
        </footer>
    </div>
</body>
</html>
