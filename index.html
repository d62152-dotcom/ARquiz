<!DOCTYPE html>
<html lang="ja">
<head> 
    <meta charset="utf-8">
    <title>海洋堂デジタルクイズの説明だよ</title>
    <meta name="description" content="海洋堂デジタルクイズラリーの説明とスタート画面">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- 角丸の読みやすいフォント読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="All">
        <main class="quiz-card">
            
            <!-- 1. ヘッダータイトル -->
            <header class="quiz-header">
                <div class="badge">AR QUIZ RALLY</div>
                <h1><ruby>海洋堂<rt>かいようどう</rt></ruby>デジタルクイズの<ruby>説明<rt>せつめい</rt></ruby>だよ</h1>
            </header>
            <!-- 2. 説明文エリア -->
            <div class="instruction-box">
                <p><ruby>下<rt>した</rt></ruby>のスタートを<ruby>押<rt>お</rt></ruby>して<ruby>始<rt>はじ</rt></ruby>めるよ。</p>
                <p class="highlight-p"><ruby>始<rt>はじ</rt></ruby>めるにはカメラを<ruby>許可<rt>きょか</rt></ruby>してね。</p>
                <p><ruby>海洋堂<rt>かいようどう</rt></ruby>のどこかにおいてある<ruby>次<rt>つぎ</rt></ruby>の<ruby>画像<rt>がぞう</rt></ruby>を<ruby>探<rt>さが</rt></ruby>してね。</p>
            </div>
            <!-- 3. マーカー画像テーブル（2×2レイアウト） -->
            <div class="marker-container">
                <table class="marker-table">
                    <tr>
                        <td><img src="images/marker/pattern-senbeityan.png" alt="マーカー1"></td>
                        <td><img src="images/marker/pattern-syougajizou.png" alt="マーカー2"></td>
                    </tr>
                    <tr>
                        <td><img src="images/marker/pattern-syougatyan.png" alt="マーカー3"></td>
                        <td><img src="images/marker/pattern-yanaseraion.png" alt="マーカー4"></td>
                    </tr>
                </table>
            </div>
            <!-- 4. チャレンジ＆ご褒美の説明 -->
            <div class="instruction-box">
                <p><ruby>見<rt>み</rt></ruby>つけたらカメラをかざしてクイズにチャレンジ！</p>
                <p><ruby>全問正解<rt>ぜんもんせいかい</rt></ruby>すると<ruby>特別<rt>とくべつ</rt></ruby>な<ruby>画面<rt>がめん</rt></ruby>に<ruby>行<rt>い</rt></ruby>くよ。</p>
                <p class="reward-p">レジのスタッフに<ruby>見<rt>み</rt></ruby>せて<ruby>ご褒美<rt>ごほうび</rt></ruby>をもらおう！</p>
            </div>
            <!-- 5. スタートボタン -->
            <div class="button-container">
                <button type="button" class="start-btn" onclick="location.href='newquiz.html'">
                    <ruby>スタート<rt>すたーと</rt></ruby>！
                </button>
            </div>
            <!-- 6. 注意書き -->
            <p class="notice-p">※カメラやクイズの<ruby>読<rt>よ</rt></ruby>み<ruby>込<rt>こ</rt></ruby>みが<ruby>遅<rt>おそ</rt></ruby>いときがあるよ。ゴメンネ※</p>
        </main>
        <footer>
            <p>© 海洋堂SpaceFactoryなんこく / 高知高専</p>
        </footer>
    </div>
</body>
</html>
